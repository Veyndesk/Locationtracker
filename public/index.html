<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Location Tracker</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #14171c;
    --muted: #6b7280;
    --accent: #2563eb;
    --good: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #161b22; --border: #2a313a; --text: #e6e9ee;
      --muted: #9aa4b2; --accent: #60a5fa; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  button {
    font: inherit; font-weight: 550; padding: 11px 18px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; touch-action: manipulation;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .big {
    font-family: var(--mono); font-size: 24px; font-weight: 600;
    letter-spacing: -0.02em; word-break: break-all; margin: 0 0 2px;
  }
  .acc { font-family: var(--mono); font-size: 14px; margin: 0; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  dl { display: grid; grid-template-columns: minmax(112px, auto) 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .log { max-height: 220px; overflow-y: auto; font-family: var(--mono); font-size: 12.5px; }
  .log div { padding: 4px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 10px; }
  .log div:last-child { border-bottom: 0; }
  .log .t { color: var(--muted); min-width: 52px; }
  .log .best { color: var(--good); font-weight: 600; }
  .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s linear; }
  label.opt { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  input[type=number] {
    font: inherit; font-family: var(--mono); width: 68px; padding: 7px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text);
  }
  a { color: var(--accent); }
  .msg { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
  .fix {
    margin-top: 12px; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); font-size: 13.5px;
  }
  .fix b { display: block; margin-bottom: 6px; }
  .fix ol { margin: 0; padding-left: 20px; }
  .fix li { margin-bottom: 4px; }
  .hidden { display: none; }
  .pill {
    display: inline-block; font-family: var(--mono); font-size: 11.5px;
    padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Location Tracker</h1>
  <p class="sub">Browser GPS (high accuracy, needs permission) with IP geolocation as a fallback.</p>

  <div class="card">
    <h2>Precise location — browser</h2>
    <div class="row">
      <button id="start" class="primary">Get my location</button>
      <button id="stop" disabled>Stop</button>
      <label class="opt">target ± <input type="number" id="target" value="15" min="1" max="1000"> m</label>
      <label class="opt">max <input type="number" id="maxdur" value="20" min="3" max="120"> s</label>
    </div>
    <div class="bar"><i id="progress"></i></div>

    <div id="result" class="hidden" style="margin-top:16px">
      <p class="big" id="coords"></p>
      <p class="acc" id="accuracy"></p>
      <dl style="margin-top:14px">
        <dt>Source (est.)</dt><dd id="source"></dd>
        <dt>Altitude</dt><dd id="altitude"></dd>
        <dt>Heading / speed</dt><dd id="motion"></dd>
        <dt>Fix time</dt><dd id="fixtime"></dd>
        <dt>Readings</dt><dd id="count"></dd>
      </dl>
      <div class="row" style="margin-top:14px">
        <button id="copy">Copy JSON</button>
        <a id="maps" href="#" target="_blank" rel="noopener noreferrer"><button>Open in Google Maps</button></a>
      </div>
    </div>

    <div id="error" class="msg bad"></div>
    <div id="howto" class="fix hidden"></div>
  </div>

  <div class="card hidden" id="logcard">
    <h2>Convergence — every fix received</h2>
    <div class="log" id="log"></div>
  </div>

  <div class="card">
    <h2>Approximate location — IP address</h2>
    <div id="ip">Loading…</div>
  </div>

  <div class="card">
    <h2>Diagnostics</h2>
    <dl id="diag"></dl>
  </div>

</div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const fmt = (n, d = 6) => (n === null || n === undefined ? '—' : Number(n).toFixed(d));

  /* ------------------------- environment ---------------------------- */

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const hasApi = 'geolocation' in navigator;
  // Geolocation is gated on a secure context. localhost is exempt; a LAN IP
  // like http://192.168.1.5:3000 is NOT — the API is blocked outright there
  // and no permission prompt is ever shown.
  const secure = window.isSecureContext;
  const inFrame = window.self !== window.top;

  let permState = 'unknown';

  function readPermission() {
    if (!navigator.permissions?.query) return Promise.resolve('unsupported');
    return navigator.permissions
      .query({ name: 'geolocation' })
      .then((s) => {
        s.onchange = () => readPermission().then(renderDiagnostics);
        return s.state;
      })
      .catch(() => 'unsupported'); // older iOS Safari rejects this outright
  }

  function renderDiagnostics() {
    const pill = (ok, text) =>
      '<span class="pill ' + (ok ? 'good' : 'bad') + '">' + text + '</span>';
    $('diag').innerHTML =
      '<dt>Secure context</dt><dd>' + pill(secure, secure ? 'yes (' + location.protocol + ')' : 'NO — ' + location.protocol + ' blocks geolocation') + '</dd>' +
      '<dt>Geolocation API</dt><dd>' + pill(hasApi, hasApi ? 'available' : 'missing') + '</dd>' +
      '<dt>Permission</dt><dd>' + pill(permState !== 'denied', permState) + '</dd>' +
      '<dt>In iframe</dt><dd>' + (inFrame ? pill(false, 'yes — needs allow="geolocation"') : 'no') + '</dd>' +
      '<dt>Platform</dt><dd>' + (isIOS ? 'iOS' : isAndroid ? 'Android' : 'desktop') + '</dd>' +
      '<dt>Origin</dt><dd>' + location.origin + '</dd>';
  }

  /* ---------------------- platform-specific help -------------------- */

  function showHowTo(kind) {
    let title, steps;

    if (kind === 'insecure') {
      title = 'This page is not served over HTTPS';
      steps = [
        'Open the deployed https:// URL instead of a LAN address like http://192.168.x.x.',
        'Browsers only exempt <code>localhost</code> from the HTTPS rule — a phone reaching your PC by IP is not exempt.',
        'For local testing on a phone, tunnel it: <code>npx localtunnel --port 3000</code> or <code>ngrok http 3000</code>.',
      ];
    } else if (isIOS) {
      title = 'Enable location for Safari on iOS';
      steps = [
        'Settings → Privacy &amp; Security → Location Services → <b>On</b>.',
        'In that same list: Safari Websites → <b>While Using the App</b>, and turn <b>Precise Location</b> on. Without it iOS rounds you to ~1–5 km.',
        'In Safari, tap <b>ᴀA</b> in the address bar → Website Settings → Location → <b>Allow</b>.',
        'If you use Chrome/Firefox on iOS, grant location to that app in Settings too.',
      ];
    } else if (isAndroid) {
      title = 'Enable location for Chrome on Android';
      steps = [
        'Tap the <b>lock icon</b> in the address bar → Permissions → Location → <b>Allow</b>.',
        'Android Settings → Location → <b>On</b>, and set Location accuracy / Google Location Accuracy to on.',
        'Android Settings → Apps → Chrome → Permissions → Location → <b>Allow only while using the app</b>.',
        'Turn off Battery Saver — it throttles GPS.',
      ];
    } else {
      title = 'Enable location for this site';
      steps = [
        'Click the icon at the left of the address bar → Location → <b>Allow</b>, then reload.',
        'On Windows: Settings → Privacy &amp; security → Location → <b>On</b> for desktop apps.',
      ];
    }

    $('howto').classList.remove('hidden');
    $('howto').innerHTML = '<b>' + title + '</b><ol><li>' + steps.join('</li><li>') + '</li></ol>';
  }

  /* ------------------------------------------------------------------ *
   * Core: collect fixes with watchPosition and keep the most accurate.
   * The first fix is usually WiFi/cell-based (±500-2000 m); the GPS chip
   * needs a few seconds to lock and then reports ±5-20 m. A single
   * getCurrentPosition() call almost always returns the coarse one.
   * ------------------------------------------------------------------ */
  function trackBestFix({ targetAccuracy, maxDurationMs, onReading, onDone, onError }) {
    let best = null;
    let count = 0;
    let watchId = null;
    let timer = null;
    let finished = false;
    let lastError = null;

    const finish = (reason) => {
      if (finished) return;
      finished = true;
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      clearTimeout(timer);
      if (best) onDone(best, count, reason);
      else onError(lastError || { code: 3, message: 'No position fix within the time limit.' });
    };

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        count++;
        const improved = !best || pos.coords.accuracy < best.coords.accuracy;
        if (improved) best = pos;
        onReading(pos, improved, count);
        // Good enough — stop early rather than burning battery.
        if (best.coords.accuracy <= targetAccuracy) finish('target reached');
      },
      (err) => {
        lastError = err;
        // PERMISSION_DENIED is terminal. Timeouts/unavailable may still recover,
        // so only bail out early if we have nothing at all.
        if (err.code === 1) {
          if (watchId !== null) navigator.geolocation.clearWatch(watchId);
          clearTimeout(timer);
          finished = true;
          onError(err);
        }
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: maxDurationMs }
    );

    timer = setTimeout(() => finish('time limit'), maxDurationMs);
    return () => finish('stopped');
  }

  /* --------------------------- UI wiring ---------------------------- */

  let cancel = null;
  let bestFix = null;

  const sourceGuess = (a) =>
    a <= 30 ? 'GPS / GNSS' :
    a <= 200 ? 'WiFi positioning' :
    a <= 3000 ? 'Cell tower' : 'IP / very coarse';

  const accClass = (a) => (a <= 30 ? 'good' : a <= 500 ? 'warn' : 'bad');

  function render(pos, count, reason) {
    const c = pos.coords;
    $('result').classList.remove('hidden');
    $('coords').textContent = fmt(c.latitude) + ', ' + fmt(c.longitude);
    $('accuracy').innerHTML = '<span class="' + accClass(c.accuracy) + '">± ' +
      Math.round(c.accuracy) + ' m</span>' +
      (reason ? ' <span style="color:var(--muted)">(' + reason + ')</span>' : '');
    $('source').textContent = sourceGuess(c.accuracy);
    $('altitude').textContent = c.altitude === null ? '—'
      : fmt(c.altitude, 1) + ' m' + (c.altitudeAccuracy !== null ? ' (± ' + Math.round(c.altitudeAccuracy) + ' m)' : '');
    $('motion').textContent = (c.heading === null || Number.isNaN(c.heading) ? '—' : fmt(c.heading, 0) + '°') +
      ' / ' + (c.speed === null ? '—' : fmt(c.speed, 1) + ' m/s');
    $('fixtime').textContent = new Date(pos.timestamp).toISOString();
    $('count').textContent = count + ' fix' + (count === 1 ? '' : 'es');
    $('maps').href = 'https://www.google.com/maps?q=' + c.latitude + ',' + c.longitude;
    bestFix = {
      latitude: c.latitude, longitude: c.longitude, accuracyMeters: c.accuracy,
      altitude: c.altitude, altitudeAccuracy: c.altitudeAccuracy,
      heading: c.heading, speed: c.speed,
      timestamp: new Date(pos.timestamp).toISOString(),
      source: sourceGuess(c.accuracy), readings: count
    };
    compareWithIp();
  }

  function logLine(pos, improved, n, t0) {
    $('logcard').classList.remove('hidden');
    const d = document.createElement('div');
    d.innerHTML = '<span class="t">+' + ((Date.now() - t0) / 1000).toFixed(1) + 's</span>' +
      '<span class="' + (improved ? 'best' : '') + '">#' + n + '  ± ' + Math.round(pos.coords.accuracy) + ' m' +
      (improved ? '  ← best' : '') + '</span>';
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
  }

  function run() {
    $('error').textContent = '';
    $('howto').classList.add('hidden');
    $('log').innerHTML = '';

    if (!hasApi) {
      $('error').textContent = 'This browser has no Geolocation API.';
      return;
    }
    if (!secure) {
      $('error').textContent =
        'Blocked: geolocation needs HTTPS. On ' + location.protocol +
        ' the browser refuses the request without even prompting.';
      showHowTo('insecure');
      return;
    }

    const targetAccuracy = Math.max(1, Number($('target').value) || 15);
    const maxDurationMs = Math.max(3, Number($('maxdur').value) || 20) * 1000;
    const t0 = Date.now();

    $('start').disabled = true;
    $('stop').disabled = false;

    const tick = setInterval(() => {
      $('progress').style.width = Math.min(100, ((Date.now() - t0) / maxDurationMs) * 100) + '%';
    }, 100);

    const done = () => {
      clearInterval(tick);
      $('progress').style.width = '100%';
      $('start').disabled = false;
      $('stop').disabled = true;
      cancel = null;
      readPermission().then((s) => { permState = s; renderDiagnostics(); });
    };

    cancel = trackBestFix({
      targetAccuracy,
      maxDurationMs,
      onReading: (pos, improved, n) => {
        logLine(pos, improved, n, t0);
        if (improved) render(pos, n, 'refining…');
      },
      onDone: (pos, n, reason) => { render(pos, n, reason); done(); },
      onError: (err) => {
        const msg = {
          1: 'Permission denied. The browser is blocking location for this site.',
          2: 'Position unavailable — the OS could not resolve a fix. Location Services may be off at the system level.',
          3: 'Timed out before any fix arrived. Try outdoors, or raise the time limit.'
        };
        $('error').textContent = msg[err.code] || err.message;
        showHowTo('permission');
        $('ipfallback')?.classList.remove('hidden');
        done();
      }
    });
  }

  $('start').addEventListener('click', run);
  $('stop').addEventListener('click', () => cancel && cancel());

  $('copy').addEventListener('click', async () => {
    if (!bestFix) return;
    await navigator.clipboard.writeText(JSON.stringify(bestFix, null, 2));
    $('copy').textContent = 'Copied';
    setTimeout(() => ($('copy').textContent = 'Copy JSON'), 1200);
  });

  /* ------------------------- IP geolocation ------------------------- */

  let ipData = null;

  // Great-circle distance, metres.
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function compareWithIp() {
    if (!ipData?.available || !bestFix) return;
    const km = haversine(bestFix.latitude, bestFix.longitude, ipData.latitude, ipData.longitude) / 1000;
    const el = $('ipdelta');
    if (el) el.textContent = km.toFixed(1) + ' km off the precise fix';
  }

  fetch('/api/geo')
    .then((r) => r.json())
    .then((d) => {
      ipData = d;
      if (!d.available) {
        $('ip').innerHTML = '<p class="msg">' + (d.note || 'Unavailable.') + '</p>';
        return;
      }
      $('ip').innerHTML =
        '<p class="msg hidden" id="ipfallback"><b>Using this as the fallback</b> — precise location was not granted.</p>' +
        '<dl>' +
        '<dt>Place</dt><dd>' + [d.flag, d.city, d.countryRegion, d.country].filter(Boolean).join(' · ') + '</dd>' +
        '<dt>Coordinates</dt><dd>' + fmt(d.latitude, 4) + ', ' + fmt(d.longitude, 4) + '</dd>' +
        '<dt>Postal code</dt><dd>' + (d.postalCode || '—') + '</dd>' +
        '<dt>Timezone</dt><dd>' + (d.timezone || '—') + '</dd>' +
        '<dt>IP / ASN</dt><dd>' + (d.ip || '—') + (d.asn ? ' · AS' + d.asn : '') + '</dd>' +
        '<dt>Edge region</dt><dd>' + (d.edgeRegion || '—') + '</dd>' +
        '<dt>Difference</dt><dd id="ipdelta">—</dd>' +
        '</dl>';
      compareWithIp();
    })
    .catch((e) => { $('ip').innerHTML = '<p class="msg bad">Failed to load: ' + e.message + '</p>'; });

  /* ---------------------------- startup ----------------------------- */

  readPermission().then((s) => {
    permState = s;
    renderDiagnostics();

    if (!secure) {
      $('error').textContent =
        'Geolocation is blocked on ' + location.protocol + ' — it needs HTTPS.';
      showHowTo('insecure');
      return;
    }
    // Already granted on a previous visit: browsers remember the decision, so
    // this runs with no prompt at all. This is as close to "automatic" as the
    // platform permits — the first grant always requires a user action.
    if (s === 'granted') run();
    if (s === 'denied') showHowTo('permission');
  });
})();
</script>
</body>
</html>
